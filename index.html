<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sebut Harga Takaful</title>
<style>
  :root {
    --brand: #c8102e;
    --brand-dark: #9e0b24;
    --ink: #1d1d1f;
    --muted: #6b6b70;
    --line: #ecdfe2;
    --bg: #fbf6f7;
    --card: #ffffff;
    --note: #fff5c2;
    --basic: #5f6b7a;
    --premium: #a8740f;
    --platinum: #2b2b30;
    --sejuta: #c8102e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  header h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
  header h1 span { color: var(--brand); }
  header p { margin: 4px 0 0; color: var(--muted); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-top: 20px;
  }
  .field + .field { margin-top: 14px; }
  .field > label, .lbl { display: block; font-weight: 600; margin-bottom: 6px; }
  .opt { font-weight: 400; color: var(--muted); }
  input[type=number], input[type=text] {
    font: inherit;
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #fff;
  }
  input:focus { outline: none; border-color: var(--brand); }
  input[type=number] { font-size: 1.4rem; font-weight: 700; }

  .seg { display: flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    flex: 1;
    text-align: center;
    padding: 10px 8px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }
  .seg label + input + label { border-left: 1.5px solid var(--line); }
  .seg input:checked + label { background: var(--brand); color: #fff; }
  .seg input:focus-visible + label { outline: 2px solid var(--brand-dark); outline-offset: -4px; }

  .error { color: var(--brand); font-size: 0.9rem; margin-top: 10px; min-height: 1.2em; }

  #quote[hidden] { display: none; }
  .q-head {
    background: var(--brand);
    color: #fff;
    border-radius: 16px;
    padding: 18px 20px;
    margin-top: 20px;
  }
  .q-head small { opacity: 0.85; display: block; }
  .q-head strong { font-size: 1.15rem; display: block; }

  .plan {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-top: 14px;
    overflow: hidden;
  }
  .plan h3 {
    margin: 0;
    padding: 12px 18px;
    background: var(--tier);
    color: #fff;
    font-size: 1rem;
    letter-spacing: 0.06em;
  }
  .plan ul { margin: 0; padding: 14px 18px 4px 38px; }
  .plan li { margin-bottom: 6px; }
  .plan .price {
    padding: 8px 18px 16px;
    font-size: 1.7rem;
    font-weight: 800;
    color: var(--tier);
  }
  .plan .price small { font-size: 0.9rem; font-weight: 600; color: var(--muted); }
  .plan .est {
    display: inline-block;
    vertical-align: middle;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--note);
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 6px;
  }

  .note {
    background: var(--note);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.85rem;
    margin-top: 14px;
  }
  .note[hidden] { display: none; }

  .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  button, .btn {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    flex: 1;
    min-width: 140px;
    text-align: center;
    text-decoration: none;
  }
  .primary { background: var(--brand); color: #fff; }
  .primary:hover { background: var(--brand-dark); }
  .wa { background: #1fa855; color: #fff; }
  .ghost { background: #fff; color: var(--brand); border: 1.5px solid var(--brand); }

  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 28px; }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .plan { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="no-print">
    <h1>Sebut Harga <span>Takaful</span></h1>
    <p>Masukkan umur &amp; profil, sebut harga terus keluar.</p>
  </header>

  <form class="card no-print" id="form" autocomplete="off">
    <div class="field">
      <label for="age">Umur</label>
      <input id="age" type="number" inputmode="numeric" min="18" max="70" placeholder="cth: 45" autofocus>
    </div>
    <div class="field">
      <span class="lbl">Jantina</span>
      <div class="seg">
        <input type="radio" name="gender" id="g-m" value="m" checked><label for="g-m">Lelaki</label>
        <input type="radio" name="gender" id="g-f" value="f"><label for="g-f">Wanita</label>
      </div>
    </div>
    <div class="field">
      <span class="lbl">Merokok?</span>
      <div class="seg">
        <input type="radio" name="smoker" id="s-n" value="nonsmoker" checked><label for="s-n">Tidak</label>
        <input type="radio" name="smoker" id="s-y" value="smoker"><label for="s-y">Ya</label>
      </div>
    </div>
    <div class="field">
      <label for="name">Nama pelanggan <span class="opt">(pilihan)</span></label>
      <input id="name" type="text" placeholder="cth: Encik Ahmad">
    </div>
    <div class="error" id="error"></div>
  </form>

  <section id="quote" hidden>
    <div class="q-head">
      <small>Sebut harga untuk</small>
      <strong id="q-who"></strong>
      <small id="q-date"></small>
    </div>

    <div id="plans"></div>

    <div class="note" id="est-note" hidden></div>

    <div class="actions no-print">
      <button class="primary" type="button" id="copy">Salin teks</button>
      <a class="btn wa" id="wa" target="_blank" rel="noopener">Hantar ke WhatsApp</a>
      <button class="ghost" type="button" onclick="window.print()">Cetak / PDF</button>
    </div>
  </section>

  <footer>
    Caruman bulanan takaful. Kadar sebenar tertakluk kepada underwriting dan terma pelan.
  </footer>
</div>

<script>
  // Caruman bulanan (RM) ikut profil "<jantina>-<merokok>", kemudian umur.
  // Entri boleh jadi nombor, atau { price, extras } bila ada manfaat yang ikut umur.
  const PLANS = [
    {
      name: "BASIC PLAN",
      tier: "--basic",
      benefits: [
        "RM 50,000 untuk kematian atau lumpuh kekal atau sakit kritikal",
        "Perlindungan dan caruman sehingga umur 70 tahun",
      ],
      rates: {
        "m-smoker": { 45: 171 },
      },
    },
    {
      name: "PREMIUM PLAN",
      tier: "--premium",
      benefits: [
        "RM 350,000 untuk kematian (hibah takaful) atau lumpuh kekal",
        "RM 700,000 jika kematian ketika tunaikan haji/umrah",
        "Free estate management RM 15,000",
        "Perlindungan sehingga umur 60 tahun",
      ],
      rates: {
        "m-smoker": { 45: 263.67 },
      },
    },
    {
      name: "PLATINUM PLAN",
      tier: "--platinum",
      benefits: [
        "RM 350,000 untuk kematian (hibah takaful) atau lumpuh kekal",
        "RM 700K kematian ketika haji atau umrah",
        "RM 1.05 Juta kematian naik kenderaan awam",
        "Free estate management RM 15,000",
        "Coverage sehingga umur 70 tahun",
      ],
      rates: {
        "m-smoker": { 45: { price: 392.33, extras: ["Cash value masa umur 70 tahun RM 32,500+/-"] } },
      },
    },
    {
      name: "SEJUTA MAKNA PLAN",
      tier: "--sejuta",
      benefits: [
        "RM 1,000,000 perlindungan takaful",
        "Perlindungan 10 tahun",
      ],
      // Jadual poster hanya ada umur 20, 25 ... 50; umur di antaranya dianggar secara linear.
      interpolate: true,
      rates: {
        "m-nonsmoker": { 20: 130, 25: 131, 30: 132, 35: 148, 40: 185, 45: 290, 50: 574 },
        "f-nonsmoker": { 20: 93, 25: 97, 30: 100, 35: 122, 40: 162, 45: 245, 50: 457 },
      },
    },
  ];

  const MIN_AGE = 18;
  const MAX_AGE = 70;

  const $ = (id) => document.getElementById(id);
  const rm = (n) =>
    "RM " + n.toLocaleString("en-MY", {
      minimumFractionDigits: Number.isInteger(n) ? 0 : 2,
      maximumFractionDigits: 2,
    });

  function quoteFor(plan, profile, age) {
    const table = plan.rates[profile];
    if (!table) return null;
    const entry = table[age];
    if (entry !== undefined) {
      return typeof entry === "number" ? { price: entry, extras: [] } : { extras: [], ...entry };
    }
    if (!plan.interpolate) return null;
    const ages = Object.keys(table).map(Number).sort((a, b) => a - b);
    const hi = ages.findIndex((a) => a > age);
    if (hi <= 0) return null;
    const a = ages[hi - 1], b = ages[hi];
    const t = (age - a) / (b - a);
    return { price: Math.round(table[a] + (table[b] - table[a]) * t), extras: [], estimated: true };
  }

  let current = null;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function render() {
    const raw = $("age").value.trim();
    $("error").textContent = "";
    current = null;
    if (raw === "") { $("quote").hidden = true; return; }

    const age = Number(raw);
    if (!Number.isInteger(age) || age < MIN_AGE || age > MAX_AGE) {
      $("quote").hidden = true;
      $("error").textContent = `Sila masukkan umur antara ${MIN_AGE} dan ${MAX_AGE}.`;
      return;
    }

    const gender = document.querySelector("input[name=gender]:checked").value;
    const smoker = document.querySelector("input[name=smoker]:checked").value;
    const name = $("name").value.trim();
    const profile = `${gender === "m" ? "Lelaki" : "Wanita"}, ${age} tahun, ${smoker === "smoker" ? "merokok" : "tidak merokok"}`;

    const quotes = PLANS
      .map((plan) => ({ plan, q: quoteFor(plan, `${gender}-${smoker}`, age) }))
      .filter((x) => x.q);

    if (quotes.length === 0) {
      $("quote").hidden = true;
      $("error").textContent = `Kadar untuk ${profile.toLowerCase()} belum dimasukkan lagi.`;
      return;
    }

    current = { name, profile, quotes };

    $("q-who").textContent = name ? `${name} · ${profile}` : profile;
    $("q-date").textContent = new Date().toLocaleDateString("ms-MY", { day: "numeric", month: "long", year: "numeric" });

    const box = $("plans");
    box.replaceChildren();
    for (const { plan, q } of quotes) {
      const card = el("article", "plan");
      card.style.setProperty("--tier", `var(${plan.tier})`);
      card.append(el("h3", null, plan.name));
      const ul = el("ul");
      for (const b of [...plan.benefits, ...q.extras]) ul.append(el("li", null, b));
      card.append(ul);
      const price = el("div", "price", rm(q.price));
      price.append(el("small", null, " / bulan"));
      if (q.estimated) price.append(el("span", "est", "anggaran"));
      card.append(price);
      box.append(card);
    }

    const note = $("est-note");
    note.hidden = !quotes.some((x) => x.q.estimated);
    note.textContent = "Kadar bertanda anggaran dikira daripada umur terdekat dalam jadual. Sila sahkan kadar tepat sebelum memuktamadkan pelan.";

    $("wa").href = "https://wa.me/?text=" + encodeURIComponent(messageText());
    $("quote").hidden = false;
  }

  function messageText() {
    const c = current;
    const lines = ["*SEBUT HARGA TAKAFUL*"];
    if (c.name) lines.push(`Untuk: ${c.name}`);
    lines.push(c.profile);
    for (const { plan, q } of c.quotes) {
      lines.push("", `*${plan.name}*`);
      for (const b of [...plan.benefits, ...q.extras]) lines.push(`- ${b}`);
      lines.push(`- *${rm(q.price)}/MONTH*${q.estimated ? " (anggaran)" : ""}`);
    }
    if (c.quotes.some((x) => x.q.estimated)) lines.push("", "_Kadar anggaran, tertakluk pengesahan._");
    return lines.join("\n");
  }

  $("copy").addEventListener("click", async () => {
    if (!current) return;
    const btn = $("copy");
    try {
      await navigator.clipboard.writeText(messageText());
      btn.textContent = "Disalin ✓";
    } catch {
      window.prompt("Salin teks ini:", messageText());
    }
    setTimeout(() => (btn.textContent = "Salin teks"), 1800);
  });

  $("form").addEventListener("input", render);
  $("form").addEventListener("change", render);
  $("form").addEventListener("submit", (e) => e.preventDefault());
</script>
</body>
</html>
